[project]
name = "set2go"
version = "0.1.0"
description = "Pioneer CDJ device library export spike — local proof of concept"
requires-python = ">=3.15"
dependencies = [
    "construct>=2.10.70",
    "flask>=3.1.3",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "pyrekordbox>=0.5.0",
    "rekordbox-pdb",
]

[tool.uv.sources]
rekordbox-pdb = { git = "https://github.com/fragmede/rekordbox-pdb.git" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
